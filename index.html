<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Race - Side Scroller</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚂</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            max-height: 100dvh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: fixed;
            inset: 0;
        }

        #gameWrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            width: 100dvw;
            height: 100%;
            height: 100dvh;
            max-height: 100dvh;
            overflow: hidden;
        }

        #topBar {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: #222;
            justify-content: center;
            flex-shrink: 0;
        }

        .game-btn {
            padding: 4px 14px;
            font-size: 20px;
            line-height: 1;
            border: 2px solid #555;
            border-radius: 4px;
            cursor: pointer;
            background: #333;
            color: #ddd;
            transition: background 0.15s, color 0.15s;
            user-select: none;
            -webkit-user-select: none;
        }

        .game-btn:hover {
            background: #444;
            color: #fff;
        }

        .game-btn:active {
            background: #555;
        }

        #pauseBtn.paused {
            background: #e67e22;
            color: #fff;
            border-color: #d35400;
        }

        #gameContainer {
            position: relative;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #333;
            font-size: 18px;
            font-weight: bold;
            z-index: 10;
        }

        .stat {
            margin: 5px 0;
        }

        #bottomBar {
            padding: 10px 12px;
            background: #222;
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }

        #boostBtn {
            width: 100%;
            padding: 18px 0;
            font-family: monospace;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
            border: 3px solid #c0392b;
            border-radius: 6px;
            cursor: pointer;
            background: #e74c3c;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.1s;
        }

        #boostBtn:hover {
            background: #ff6b5a;
        }

        #boostBtn:active, #boostBtn.active {
            background: #ff9800;
            border-color: #e65100;
        }
    </style>
</head>
<body>
    <div id="gameWrapper">
        <div id="topBar">
            <button class="game-btn" id="restartBtn" title="Restart">&#x21BB;</button>
            <button class="game-btn" id="nextLevelBtn" title="Next Level">&#x23ED;</button>
            <button class="game-btn" id="pauseBtn" title="Pause">&#x23F8;</button>
        </div>
        <div id="gameContainer">
            <canvas id="gameCanvas"></canvas>
            <div id="ui">
                <div class="stat">Speed: <span id="speed">0</span></div>
                <div class="stat">Distance: <span id="distance">0</span></div>
            </div>
        </div>
        <div id="bottomBar">
            <button id="boostBtn">BOOST</button>
        </div>
    </div>

    <script src="sprites.js"></script>
    <script src="game.js"></script>
</body>
</html>
